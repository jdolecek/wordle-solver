<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121213">
  <meta name="description" content="A mobile Wordle assistant using a provably optimal strategy.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Wordle Solver</title>
</head>
<body>
  <main class="app-shell">
    <header>
      <div>
        <p class="eyebrow">LEVEL 12</p>
        <h1>Wordle Solver</h1>
      </div>
      <button id="new-game" class="icon-button" type="button" aria-label="Start a new game">↻</button>
    </header>

    <section id="loading" class="panel status-panel">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading the optimal strategy…</p>
    </section>

    <div id="game" hidden>
      <section class="summary" aria-live="polite">
        <strong id="candidate-count">2,315</strong>
        <span id="candidate-label">possible answers</span>
      </section>

      <section id="history" class="history" aria-label="Guess history"></section>

      <section id="recommendations" class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="strategy-label">PROVABLY OPTIMAL</p>
            <h2>Next guesses</h2>
          </div>
        </div>
        <div id="choice-list" class="choice-list"></div>
        <div class="custom-guess">
          <label for="custom-word">Or use your own word</label>
          <div class="input-row">
            <input id="custom-word" maxlength="5" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CRANE">
            <button id="use-custom" class="secondary-button" type="button">Use</button>
          </div>
        </div>
      </section>

      <section id="feedback-panel" class="panel" hidden>
        <p class="eyebrow">ENTER WORDLE'S COLORS</p>
        <h2 id="feedback-title">Feedback for SALET</h2>
        <p class="hint">Tap each tile to cycle gray → yellow → green.</p>
        <div id="feedback-tiles" class="feedback-tiles" aria-label="Feedback tiles"></div>
        <button id="submit-feedback" class="primary-button" type="button">Submit feedback</button>
        <button id="change-guess" class="text-button" type="button">Choose a different word</button>
      </section>

      <section id="solved-panel" class="panel solved-panel" hidden>
        <p class="eyebrow">SOLVED</p>
        <h2 id="solved-title">Nice work!</h2>
        <button id="play-again" class="primary-button" type="button">New puzzle</button>
      </section>

      <p id="message" class="message" role="alert"></p>

      <footer>
        <button id="undo" class="text-button" type="button" disabled>Undo last guess</button>
        <span>Runs locally in Chrome</span>
      </footer>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
