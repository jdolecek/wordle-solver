<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121213">
  <title>Refreshing Wordle Solver</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121213; color: #f8f8f8; font: 16px system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    p { color: #a7a7aa; }
  </style>
</head>
<body>
  <main><h1>Refreshing the solver…</h1><p>This clears only the Wordle Solver cache.</p></main>
  <script>
    Promise.all([
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))),
      navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(items => Promise.all(items.map(item => item.unregister()))) : Promise.resolve()
    ]).then(() => location.replace("./?refreshed=7"));
  </script>
</body>
</html>
